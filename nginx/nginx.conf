# ============================================================
# PS2 Cloud Gaming Platform — Nginx Configuration
# Reverse proxy for backend API, WebSocket, and static files
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Logging ──────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ─── Performance ──────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # ─── Gzip Compression ────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # ─── WebSocket Upgrade Map ────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ─── Upstream: Backend Server ─────────────────────────
    upstream backend {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    server {
        listen 80;
        # listen 443 ssl http2;  # Uncomment for HTTPS
        server_name _ ps2.tiunusia.web.id localhost;

        # ─── Security Headers ────────────────────────────
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # ─── Frontend (React SPA) ────────────────────────
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ─── Controller Page ─────────────────────────────
        location /controller {
            alias /usr/share/nginx/controller;
            try_files $uri $uri/ /controller/index.html;
        }

        # ─── API Proxy ───────────────────────────────────
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # ─── WebSocket (Socket.io) ───────────────────────
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;   # Keep WebSocket alive
            proxy_send_timeout 86400s;
        }

        # ─── Static: Game Covers ─────────────────────────
        location /covers/ {
            alias /usr/share/nginx/covers/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ─── Static: Screenshots ─────────────────────────
        location /screenshots/ {
            alias /usr/share/nginx/screenshots/;
            expires 1d;
            add_header Cache-Control "public";
        }

        # ─── Health Check ────────────────────────────────
        location /health {
            proxy_pass http://backend/api/health;
            access_log off;
        }
    }
}
